# Checks, in a container.
#
#   pnpm docker:check       build, lint, typecheck and test, in that order
#   pnpm docker:lint        lint only
#   pnpm docker:typecheck   typecheck only
#   pnpm docker:test        tests only
#
# One service per check, because CI runs them as separate jobs and a
# contributor reproducing a red check should be able to run that check alone
# rather than waiting on the three that were already green.
#
# No database service. This file existed for one, back when the migration suite
# needed a Postgres reachable over the network and skipped itself when it could
# not find one. The hub's database is a file now, so those suites open one in a
# temporary directory and run unconditionally here, in CI, and on a laptop.
# What is left is the reason the file still earns its place: every check runs
# against the same built tree in the same image, so a green run here is the
# same evidence CI produces.

name: agentplex-test

# The full workspace: every dependency, every source file, already built. The
# build stage runs `pnpm build`, so every service below starts from a tree that
# compiled — which is also why there is no `build` service here. A failing
# build fails the image, and no check gets as far as running.
x-checks: &checks
  build:
    context: .
    target: build

services:
  # The whole set in one container, still. CI no longer runs this, but it is
  # what a contributor runs before opening a pull request, and it is the one
  # command that answers "would CI be green" without reading four job results.
  check:
    <<: *checks
    command: ['pnpm', 'check']

  lint:
    <<: *checks
    command: ['pnpm', 'lint']

  typecheck:
    <<: *checks
    command: ['pnpm', 'typecheck']

  test:
    <<: *checks
    command: ['pnpm', 'test']
