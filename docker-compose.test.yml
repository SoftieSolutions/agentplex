# Checks, in a container.
#
#   pnpm docker:check       build, lint, typecheck and test, in that order
#   pnpm docker:lint        lint only
#   pnpm docker:typecheck   typecheck only
#   pnpm docker:test        tests only
#   pnpm docker:install     the published package, installed by a bare npm
#   pnpm docker:bootstrap   install.sh, both roles, on containers with no Node
#   pnpm docker:runtime     the CLI, run inside the runtime image it ships in
#
# One service per check, because CI runs them as separate jobs and a
# contributor reproducing a red check should be able to run that check alone
# rather than waiting on the three that were already green.
#
# Every command above is a script in the root manifest, and a job that runs one
# of these checks runs that script rather than a version of it assembled in the
# workflow. That is what the scripts are for: a workflow that builds its own
# leaves two commands where there was one, and the one nobody runs is the one
# that rots -- which is exactly how the bootstrap below came to fail on a
# laptop while CI called it green.
#
# Not every service is a container to run, though. The four checks are a
# command in an image. The two bootstraps and the runtime check are a stage
# whose every RUN line is an assertion, so building them is running them and
# there is nothing left to start afterwards -- `pnpm docker:bootstrap` and
# `pnpm docker:runtime` are a `docker compose build`.
#
# No database service, and none is needed: the hub's database is a file, so the
# migration and query suites open one in a temporary directory and run
# unconditionally here, in CI, and on a laptop. What this file buys is that
# every check runs against the same built tree in the same image, so a green
# run here is the same evidence CI produces.

name: agentplex-test

# The full workspace: every dependency, every source file, already built. The
# build stage runs `pnpm build`, so every service below starts from a tree that
# compiled — which is also why there is no `build` service here. A failing
# build fails the image, and no check gets as far as running.
#
# The four services below build the same target from the same context, so they
# are one image wearing four names. Without an explicit `image:` Compose tags
# the build per service — `agentplex-test-lint`, `-typecheck`, `-test`,
# `-check` — and `docker compose run --rm` removes the container but never the
# image, so the tags are what accumulate. Naming the image once leaves one.
#
# The tag is the project's rather than a constant, because two worktrees
# running checks at the same time would otherwise fight over one name: export
# `COMPOSE_PROJECT_NAME` and each keeps its own image. The default matches the
# `name:` above, which is what `COMPOSE_PROJECT_NAME` already resolves to when
# nothing is exported. Tearing one down is `docker compose -f
# docker-compose.test.yml down --rmi local`, run for the project that built it:
# Compose removes every image labelled as the project's own, and a name we chose
# is still one of those. The `-f` is load-bearing. Without it the command
# resolves to docker-compose.yml instead, and stops the hub and removes its
# image.
x-checks: &checks
  build:
    context: .
    target: build
  image: ${COMPOSE_PROJECT_NAME:-agentplex-test}-checks

services:
  # The whole set in one container, still. CI no longer runs this, but it is
  # what a contributor runs before opening a pull request, and it is the one
  # command that answers "would CI be green" without reading four job results.
  check:
    <<: *checks
    command: ['pnpm', 'check']

  lint:
    <<: *checks
    command: ['pnpm', 'lint']

  typecheck:
    <<: *checks
    command: ['pnpm', 'typecheck']

  # The suite, under the guard that keeps its writes inside the sandbox.
  #
  # `test-write-guard.ts` walks the filesystem before and after the run, skips
  # the workspace and `$TMPDIR`, and fails naming any path that changed outside
  # them together with the test files that were running when it did. It is
  # wired here rather than into `pnpm test` because the machine is what makes
  # the check possible: a container's filesystem is disposable and quiet, and a
  # laptop's is neither -- a browser and an editor write during the seconds the
  # suite takes, and a guard that reports their writes as the suite's is
  # believed exactly once. `check` above deliberately stays the plain command:
  # it is the prediction of CI a contributor runs, and CI runs this service.
  test:
    <<: *checks
    command: ['node', 'scripts/test-write-guard.ts', 'pnpm', 'test']

  # The one check that is not about this tree. `install-check` assembles the
  # four publishable packages, packs them, and installs them with a bare npm on
  # a stock `debian:bookworm-slim` with nothing but Node added -- the machine a
  # user actually has, and the only place the native addon, the bundled
  # protocol, the `bin` shebang and the hub resolving the client out of a
  # sibling package are exercised together.
  #
  # The assertions are RUN lines inside that stage, so this passes or fails
  # during `--build`. The command below runs the report again for a person to
  # read: `doctor` exits 1 in a container with no coding agent installed, which
  # is a true statement about the container, so what is checked is that the
  # report was produced at all.
  install:
    build:
      context: .
      target: install-check
    command:
      - sh
      - -c
      - agentplex doctor --role=server --server-identity-file=/var/lib/agentplex/server.json
        | tee /dev/stderr | grep -qx providers

  # The bootstrap, on the machine it was written for: a stock
  # `debian:bookworm-slim` with no Node, no compiler and no agentplex, where
  # `install.sh` has to produce all three as an unprivileged user.
  #
  # Every assertion is a RUN line inside `bootstrap-check`, so this service is
  # built and never run, and the reports a person wants to read -- which
  # provider `doctor` found, and which directory it came out of -- are printed
  # by the stage that produced them.
  #
  # Running it is not merely redundant, it is impossible: the stage ends by
  # undoing both installs it made, the user one and the `--system` one, because
  # this is the only machine in the repository an uninstall can be exercised
  # against something that was really installed. The image it finishes with has
  # no `agentplex` on it to type.
  bootstrap:
    build:
      context: .
      target: bootstrap-check

  # The same bootstrap for the other role, on the machine that makes it a claim:
  # a stock `debian:bookworm-slim` where no compiler was ever installed. A hub
  # installs the command, the hub package and the client, and none of the three
  # reaches node-pty -- so there is nothing here to compile, and the stage above
  # cannot show it, because by the time it installs a hub its own server install
  # has already put a toolchain on the box.
  #
  # Built and never run, for the same reason as its sibling: every assertion is
  # a RUN line inside `hub-bootstrap-check`, including the report a person
  # wants to read -- a hub that says it opens no terminals and exits 0 on a
  # machine that could not compile one. That run needs the database path and
  # the client token a setup would have written, which the stage supplies and a
  # bare `agentplex doctor --role=hub` on the finished image cannot.
  bootstrap-hub:
    build:
      context: .
      target: hub-bootstrap-check

  # The image docker-compose.yml deploys, with the bin run inside it. Every
  # check above either runs in the full workspace, where every package is
  # installed, or installs the packed tarballs, which bundle their own; the
  # runtime image is neither, and it copies each workspace package in by name.
  # One left off that list is a command that dies at import in the shipped
  # image and passes everywhere else, which is how `status` and `update` came to
  # fail there on a missing @agentplex/release.
  #
  # Built and never run, like the bootstraps: `runtime-check` is `runtime` plus
  # RUN lines that each invoke a command and write nothing.
  runtime:
    build:
      context: .
      target: runtime-check
