# The check set, one job per check.
#
# Each job still runs a `pnpm docker:*` command that a contributor can run
# identically on a laptop. CI assembling its own version of the checks — its
# own eslint invocation, its own vitest flags — is how a workflow and
# CONTRIBUTING drift apart, and splitting the set into jobs is not a reason to
# start. The database suites need nothing from this workflow: the hub's database
# is a file, so they open one in a temporary directory and run here exactly as
# they do on a laptop. Nothing is conditional and nothing skips.

name: CI

on:
  pull_request:
  push:
    branches: [master]

# A force-push abandons the run it superseded. A push to master is left to
# finish, because its result is the record of what that commit did.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs read the tree and write nothing back to the repository.
permissions:
  contents: read

jobs:
  # The build is a check in its own right, not a setup step: the `build` stage
  # ends in `pnpm build`, so a workspace that does not compile fails here under
  # its own name instead of turning three unrelated checks red.
  #
  # It is also the only job that writes the layer cache. The three below read
  # it, so the workspace is installed and compiled once per run rather than
  # four times.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the workspace
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: build
          cache-from: type=gha
          cache-to: type=gha,mode=max

  checks:
    # Renders as `lint`, `typecheck` and `test` rather than `checks (lint)`.
    name: ${{ matrix.check }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # The point of splitting the set: a lint failure must not cancel the
      # typecheck and test jobs. Three separate answers, or this is the old
      # single job wearing three names.
      fail-fast: false
      matrix:
        check: [lint, typecheck, test]
    env:
      # corepack stops to ask before fetching pnpm, and a runner has nobody to
      # answer.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's default Node is older than the one this workspace
      # declares, and .npmrc sets engine-strict, so pnpm has grounds to refuse
      # before it ever reaches Docker.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Nothing is loaded or pushed here; the layers this leaves in the job's
      # builder are the point. `build` already wrote them to the cache this
      # reads, so a job that changes no dependency restores `pnpm install` and
      # `pnpm build` instead of re-running them. The compose build below
      # resolves the same target on the same builder and reuses every one.
      - name: Restore the build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: build
          cache-from: type=gha

      # corepack reads the pinned pnpm out of packageManager, the same way the
      # image does, so the runner cannot end up on a different one.
      - name: Install pnpm
        run: corepack enable && corepack install

      # Every check is one container and nothing else: docker-compose.test.yml
      # has no service for a database to run in any more, because the hub's is
      # a file the suites make for themselves.
      - name: Check
        run: pnpm docker:${{ matrix.check }}

  # The clean install, which is the acceptance criterion for the published
  # package and the one thing the four jobs above cannot tell you. They all run
  # inside a workspace pnpm installed and built; this one assembles the package,
  # packs it, and installs it with a bare npm on a stock `debian:bookworm-slim`
  # with nothing but Node added.
  #
  # A job of its own rather than a fifth entry in that matrix: it builds a
  # different stage, it reaches the npm registry, and the failures it catches --
  # a native addon that will not compile, a bundled dependency npm declines to
  # fetch, a `bin` the kernel hands to the shell -- are about the artifact and
  # not about the tree. A red one here means a stranger's first command fails,
  # which is not the same news as a red lint.
  install:
    name: install
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The assertions are RUN lines inside the `install-check` stage, so
      # building it is running them. `build` wrote the layers this reads, so the
      # workspace is not installed and compiled a second time to get here.
      - name: Install the published package on a bare machine
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: install-check
          cache-from: type=gha

  # The runtime image, with the bin run inside it. `install` above proves the
  # tarballs a stranger installs; this proves the image docker-compose.yml
  # deploys, which is assembled differently -- each workspace package copied in
  # by name -- and so can be missing one that every other job has. It was:
  # `status` and `update` died at import on @agentplex/release while the rest
  # of this workflow was green.
  #
  # It reads the cache and writes none. `build` stays the only writer, because
  # a second job writing the default scope would replace its layers with this
  # target's. The cost is `runtime-deps`, which no written cache holds: its
  # production install and node-pty's compile run afresh here every time.
  runtime:
    name: runtime
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The assertions are RUN lines inside `runtime-check`, so building it is
      # running them, the same stage `pnpm docker:runtime` builds.
      - name: Run the CLI in the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime-check
          cache-from: type=gha

  # The bootstrap: `install.sh` against the machine it was written for. The job
  # above starts from a container that already has Node and a compiler, because
  # that is the artifact's criterion; this one starts from a container that has
  # neither, because producing them is the script's.
  #
  # shellcheck runs on the runner and not in a container. The check image is a
  # Node image, and adding a Haskell binary to it to lint one shell script is a
  # worse trade than a job that runs the tool the runner already ships. It is
  # first because it costs seconds: a quoting bug should not wait behind a
  # container that downloads a runtime to find it.
  bootstrap:
    name: bootstrap
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # So that the command run here is the command in package.json, which is
      # the command a contributor runs. shellcheck itself is on the runner.
      - name: Install pnpm
        run: corepack enable && corepack install

      - name: Lint install.sh
        run: pnpm lint:shell

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The same restore the check jobs do, for the same reason: both stages
      # below copy the packed release out of layers `build` already wrote, so
      # the workspace is not installed and compiled again to get here. Nothing
      # is loaded or pushed; the layers left in this job's builder are the
      # point, and the compose build below resolves them on the same builder.
      - name: Restore the build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: build
          cache-from: type=gha

      # The command a contributor runs, and not a second version of it
      # assembled here. It builds both bootstrap stages, and building them is
      # running them: every assertion is a RUN line inside one -- the runtime
      # downloaded, the toolchain sudo installed, the unit systemd itself
      # verified, `doctor` naming the provider and the directory it resolved
      # from, and a hub that arrives on a machine with no compiler on it.
      #
      # Two stages rather than two jobs, because the second cannot be a step of
      # the first: `bootstrap-check` installs a toolchain through sudo on its
      # first real step, so every hub install after that point runs on a
      # machine that already has one and proves nothing. The hub stage is the
      # only place the claim -- a hub-only machine needs no C++ toolchain --
      # can be stated, and it compiles nothing, so it is the cheaper of the two.
      - name: Bootstrap stock Debian containers with install.sh
        run: pnpm docker:bootstrap
