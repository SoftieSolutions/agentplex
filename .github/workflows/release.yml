# The release: a tag, and everything that has to be true before it becomes a
# download.
#
# Four facts shape this workflow.
#
# **A tag names one component.** `hub-v1.2.0`, `cli-v1.4.0`, `server-v1.5.0`,
# `web-v1.1.0`. Each has its own release train, because the whole point of
# splitting one tarball into four was that a CLI fix should stop forcing every
# server on the fleet to recompile a native addon -- and four packages cut at
# one version from one tag would have left exactly that coupling in place under
# four names. `assemble-package.ts` parses the tag and fails the job with it
# quoted when it names something that is not a component or a version that is
# not one.
#
# **Nothing in the workspace has a version.** Every manifest says `0.0.0` and no
# script bumps one, because a version kept in a file is a second statement of
# what is being released and it drifts from the tag the day somebody forgets.
# The tag is the statement.
#
# **Delivery is GitHub Releases, not npm.** Verified rather than assumed: `npm
# install <https tarball url>` unpacks the tarball and then resolves that
# tarball's own registry dependencies from npm in the ordinary way. So npm is
# still what installs agentplex on a machine, and nothing of ours is published
# to a registry. What this bought, immediately, is that a release stopped being
# blocked on an `NPM_TOKEN` secret that does not exist and on the questions
# behind one -- who may publish, what the 2FA policy is. `GITHUB_TOKEN` is here
# already.
#
# The asset names are constants -- `agentplex-hub.tgz`, never
# `agentplex-hub-1.2.0.tgz` -- because GitHub's `releases/latest/download/<asset>`
# redirect substitutes the tag into the path and copies the file name through
# verbatim. `npm pack` produces the version-stamped name, so this renames on the
# way up. That redirect is not what `install.sh` resolves through, but a URL
# built from a component and a version still needs its third part to be a
# constant.
#
# **`versions.json` is the version oracle, and it is published here.** With
# per-component tags, `releases/latest/download/` cannot answer "the latest
# cli": GitHub's "latest" is the most recently published release overall. So the
# `v1` job writes a manifest of what is current for every component, on the same
# branch and through the same raw.githubusercontent.com mechanism that already
# serves `install.sh`. It carries each component's protocol beside its version,
# so one unauthenticated fetch answers both what to install and whether the set
# agrees -- before anything is downloaded.

name: release

on:
  push:
    # `<component>-v<semver>`. The old `v*` shape is deliberately not here: it
    # names no component, so there is nothing it could release, and admitting
    # it would mean a tag that starts a run and then fails at the parse.
    tags: ['*-v*']

# A tag is a release, and two tags pushed together are two releases of two
# components. Nothing here cancels anything: a superseded run of CI is noise, a
# superseded release is a version that silently never happened. The group is the
# ref, so a `hub-v1.2.0` and a `cli-v1.4.0` pushed together run side by side --
# which is what independent trains means.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default. The two jobs that write -- one creates a release, one
# pushes a branch -- ask for the permission themselves, so the token that runs
# the checks cannot do either.
permissions:
  contents: read

jobs:
  # The same checks a contributor runs, by the same commands. A release is a
  # worse place than a pull request to discover that the workspace does not
  # compile, so the tag runs the set again on the exact commit being published
  # rather than trusting that the CI run on the branch is still what is here.
  #
  # The whole workspace, for a tag that releases one component. That is not an
  # oversight: the components are cut from one build of one commit, and a hub
  # release whose commit broke the server is a commit nobody should be tagging
  # from. Checking the part that is being published would make the next
  # component's release the place that discovers it.
  #
  # One container for the four checks rather than CI's matrix: a pull request
  # wants three separate answers so a lint failure does not hide a test
  # failure, and a release wants one answer to one question -- is this
  # publishable -- so `pnpm check` in a single container is the shorter way to
  # get it.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # corepack stops to ask before fetching pnpm, and a runner has nobody to
      # answer.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's default Node is older than the one this workspace
      # declares, and .npmrc sets engine-strict, so pnpm has grounds to refuse
      # before it ever reaches Docker.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # corepack reads the pinned pnpm out of packageManager, the same way the
      # image does, so the runner cannot end up on a different one.
      - name: Install pnpm
        run: corepack enable && corepack install

      - name: Build, lint, typecheck and test
        run: pnpm docker:check

  # The acceptance criterion for the artifacts, and the one thing the job above
  # cannot tell you: it runs inside a workspace pnpm installed and built, while
  # this assembles the packages, packs them, and installs them with a bare npm
  # on a stock `debian:bookworm-slim` with nothing but Node added. A native
  # addon that will not compile, a bundled dependency npm declines to fetch, a
  # `bin` the kernel hands to the shell, a hub that cannot resolve the client
  # package beside it -- every one of those is invisible until a stranger
  # installs the tarballs, and publishing is the worst moment to find out.
  #
  # All four, for a tag that releases one. The check installs them together
  # because that is how a machine meets them, and the relationship it is really
  # testing -- a hub resolving the client beside it -- needs two of them present.
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install pnpm
        run: corepack enable && corepack install

      # The assertions are RUN lines inside the `install-check` stage, so
      # building it is running them; the command the service then runs is
      # `doctor` reporting out of the installed package.
      - name: Install the published package on a bare machine
        run: pnpm docker:install

  release:
    name: release
    needs: [check, install]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The release and its tarball.
      contents: write
      # What `actions/attest-build-provenance` signs with. It is the GitHub-side
      # equivalent of what `npm publish --provenance` used to do here, and it is
      # kept for the same reason that was worth having: a downloaded tarball is
      # a file from the internet, and an attestation is what lets somebody run
      # `gh attestation verify` and be told which workflow, which commit and
      # which runner produced it. Dropping the registry should not quietly drop
      # the claim.
      id-token: write
      attestations: write
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    outputs:
      component: ${{ steps.assemble.outputs.component }}
      version: ${{ steps.assemble.outputs.version }}
      protocol: ${{ steps.assemble.outputs.protocol }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack install

      # Not the container this time: the tarball has to be packed on a machine
      # the release can also be created from, and `--frozen-lockfile` is what
      # keeps this install the same one the checks above ran against.
      - name: Install the workspace
        run: pnpm install --frozen-lockfile

      - name: Build the workspace
        run: pnpm build

      # The tag is the argument. `assemble-package.ts` parses it, assembles the
      # one component it names at the version it names, and writes
      # `release-assets/release.json` beside the staging directory -- which is
      # every fact this workflow would otherwise have to repeat: which directory
      # holds that component, what its tarball is called, and what protocol the
      # build it just packed speaks.
      #
      # The protocol is read out of the assembled manifest rather than written
      # here, and that is the point of putting it in the manifest at all: it is
      # the compiled constant the tarball itself declares, so it cannot drift
      # from what the code in the tarball does.
      - name: Assemble the component the tag names
        id: assemble
        run: |
          set -euo pipefail
          pnpm --filter ./scripts package "$GITHUB_REF_NAME"
          field() { node -p "require('./release-assets/release.json').$1"; }
          {
            echo "component=$(field component)"
            echo "version=$(field version)"
            echo "protocol=$(field protocol)"
            echo "package=$(field package)"
            echo "directory=$(field directory)"
            echo "asset=$(field asset)"
          } >> "$GITHUB_OUTPUT"

      # Packed, then renamed to the constant this component's asset is always
      # published under. `npm pack` names its output after the package and the
      # version -- `softiesolutions-agentplex-hub-1.2.0.tgz` -- and a version in
      # an asset name is a name no URL built from a component and a version
      # could ever match.
      #
      # One asset, and it used to be two. The second was a small JSON carrying
      # this release's protocol, published so that `--role=hub@1.3.0` could be
      # pre-checked before installing; `versions.json` carries every release's
      # protocol now, so the `v1` job below is the only thing that has to say
      # what this tag speaks.
      - name: Pack it under the name every release publishes it under
        run: |
          set -euo pipefail
          (cd "${{ steps.assemble.outputs.directory }}" \
            && npm pack --pack-destination "$RUNNER_TEMP")
          mv "$RUNNER_TEMP"/*.tgz "release-assets/${{ steps.assemble.outputs.asset }}"
          ls -l release-assets/

      # Before the upload rather than after it, so that a tarball nothing can
      # attest never becomes a release somebody can download.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/${{ steps.assemble.outputs.asset }}

      # The release itself. `--prerelease` for a version with a `-` in it, so
      # that a release candidate is marked as one; nothing here passes
      # `--latest`, because "latest" is a repository-wide idea and there are
      # four trains -- `versions.json` is what answers "the latest hub", and the
      # flag would only ever be misleading.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ steps.assemble.outputs.component }}
          VERSION: ${{ steps.assemble.outputs.version }}
          PROTOCOL: ${{ steps.assemble.outputs.protocol }}
          PACKAGE: ${{ steps.assemble.outputs.package }}
        run: |
          set -euo pipefail
          prerelease=''
          case "$VERSION" in *-*) prerelease='--prerelease' ;; esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --title "$COMPONENT $VERSION" \
            --notes "$PACKAGE at $VERSION, speaking protocol $PROTOCOL.

          Install with \`install.sh\`, which resolves this component through
          \`versions.json\` on the \`v1\` branch:

              curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v1/scripts/install.sh | bash

          To pin this exact release, add \`--role=${COMPONENT}@${VERSION}\`.
          \`--role=${COMPONENT}@<major>.<minor>\` takes the newest release in a
          series instead, and never a prerelease." \
            release-assets/${{ steps.assemble.outputs.asset }}

      - name: Report
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## ${{ steps.assemble.outputs.component }} ${{ steps.assemble.outputs.version }}"
            echo
            echo "- ${{ steps.assemble.outputs.package }}"
            echo "- protocol ${{ steps.assemble.outputs.protocol }}"
            echo "- ${{ steps.assemble.outputs.asset }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # The `v1` branch, which is two artifacts and one push.
  #
  # `install.sh` is fetched over https from this branch, not from a package, so
  # the script a machine runs and the packages it installs are different
  # artifacts that have to agree -- and the script is what knows which packages a
  # role takes. `versions.json` is the other one: it is how any install, pinned
  # or not, finds out which releases exist and what each one speaks, and this is
  # the only place it is written. It is append-only, so this job is also the
  # only thing that decides a release is ever visible to a pin.
  #
  # Conditional on the release having happened, and on it being a `1.x`: moving
  # `v1` to a commit whose packages were never published would point every `curl
  # | bash` at a script for a version nobody can install, and a `v2.0.0` must not
  # silently retarget the branch that v1 users are following.
  #
  # A prerelease is not excluded, and that is a change. It used to be, on the
  # argument that a release candidate is not what the documented one-liner
  # should hand out -- which is right about the branch and wrong about the
  # manifest. `install.sh` refuses a pin the manifest does not list, so a
  # prerelease left out of the file is a published tag that `--role=hub@1.3.8-rc1`
  # cannot install. So a prerelease now does half of this job: it is recorded in
  # `versions.json`, where `updateVersionsManifest` records it without making it
  # current, and it does not move the branch's tree. The script every machine
  # fetches stays the one from the last full release.
  #
  # Any component's release advances the branch, not only the CLI's. The script
  # and the packages have to agree, and the newest released commit is the one
  # that agrees with the newest package -- newest along `master`. A tag cut from
  # a commit that is not on `master`, or from one older than the tree the branch
  # already has, is recorded in the manifest and leaves the tree alone.
  #
  # No concurrency group, deliberately. Releases of different components run
  # side by side and all write this branch, and a group would keep one running
  # and one pending job and cancel the older pending ones -- four tags pushed
  # together would lose two manifest entries. The script reads the branch
  # again and retries when its push is refused instead.
  v1:
    name: v1
    needs: release
    if: startsWith(needs.release.outputs.version, '1.')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      COMPONENT: ${{ needs.release.outputs.component }}
      VERSION: ${{ needs.release.outputs.version }}
      PROTOCOL: ${{ needs.release.outputs.protocol }}
    steps:
      # Full history, because whether the released commit may become the
      # branch's tree is two ancestry questions -- is it on `master`, and does
      # it descend from the commit the tree came from last -- and a shallow
      # clone answers both "no" without knowing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack install

      # `scripts` and what it depends on, and not the workspace.
      #
      # The manifest writer imports exactly one workspace package now:
      # `@agentplex/release`, which holds the `versions.json` schema so that the
      # job writing the file and `agentplex update` reading it off the network
      # cannot disagree about what a manifest is. So this job builds one package
      # where it used to build none.
      #
      # That package depends on zod and on nothing in the workspace, which is
      # the property being protected rather than a coincidence: the job that
      # publishes the version oracle still does not wait on the hub, the server
      # or the protocol compiling, and a build failure anywhere else in the
      # workspace cannot strand a released component with no line in the file
      # that says it exists.
      #
      # The name form of the filter and not the path form: `./scripts...`
      # selects that directory alone, and only `<name>...` walks the workspace
      # dependency graph. Verified at the origin against a tree with no
      # node_modules in it, because the difference is invisible until the
      # manifest writer imports a package whose own zod was never installed.
      - name: Install what the manifest writer needs
        run: pnpm install --frozen-lockfile --filter '@agentplex/scripts...'

      - name: Build the manifest schema
        run: pnpm --filter @agentplex/release build

      # The branch is advanced rather than fast-forwarded, and the difference is
      # `versions.json`: the manifest is in no commit on `master`, so a `v1`
      # carrying one is never an ancestor of the next released commit. Each
      # release is a new commit on top of the branch's own head, holding the
      # released tree or the tree the branch already had, with the manifest
      # merged into it.
      #
      # The script carries the argument for the rest -- why a refused push is
      # read again and retried rather than serialised with a concurrency group,
      # and why a tag not on `master`, or older than the tree the branch
      # already has, is recorded without moving `install.sh`. It pushes by
      # commit id to `refs/heads/v1` and never with `--force`.
      - name: Publish versions.json and advance v1 to the released commit
        run: scripts/advance-v1.sh "$COMPONENT" "$VERSION" "$PROTOCOL" "$GITHUB_SHA" origin
