packages:
  - apps/*
  - packages/*
  # The repository's own tooling: the bootstrap an operator curls and the
  # packaging step. Nothing ships from it, and it is a member rather than a
  # plain directory because `pnpm test` is `pnpm -r test`: a suite outside a
  # member is run by nobody and reported by nobody.
  - scripts
  # Suites that load more than one app into one process. See tests/hub-server/README.md.
  - tests/*

# Postinstall scripts run only for dependencies listed here. Adding one is a
# deliberate act: it grants that package arbitrary code execution at install.
allowBuilds:
  esbuild: true
  # node-pty compiles a native addon and a `spawn-helper` binary beside it, so
  # with its scripts blocked the package installs as source that cannot load.
  # Its own `postinstall` is also the upstream fix for the executable bit the
  # npm tarball drops from that helper; `packages/pty/scripts/node-pty-postinstall.js`
  # re-checks it, because when the bit is missing the only symptom is an opaque
  # posix_spawnp failure at the first spawn.
  node-pty: true

# Registry fetches retry for longer than pnpm's defaults (2 retries, 10s then
# 1min backoff, 60s timeout). Here and not in .npmrc, which pnpm 11 reads only
# for auth; the Dockerfile's `manifests` stage asserts fetchRetries.
fetchRetries: 5
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 60000
fetchTimeout: 120000
