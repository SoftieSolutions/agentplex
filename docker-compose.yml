# The hub, Caddy in front of it, and the volume the database lives in.
#
# Copy .env.example to .env, then `docker compose up -d`.
#
# What Docker is for, now that the hub's database is a file: it is still the
# primary path for running the checks, and it is still the right way to run a
# hosted hub — one image, one restart policy, one process supervised by
# something that already knows how to restart it, and TLS in front. What it has
# stopped being is the price of entry. A single machine can run agentplexd
# natively and never build an image, which is what the installer does. Nothing
# here is legacy; it is the deployment that wants a container.
#
# Caddy is optional and dropping it is a supported path, not a hypothetical:
# `docker compose up -d hub` starts the hub and nothing else, and the hub's own
# port is published on the host either way. See docs/install.md.

name: agentplex

services:
  hub:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      AGENTPLEX_ROLE: hub
      AGENTPLEX_HUB_PORT: 8080
      # Inside the volume below, and not settable from .env: a path is only
      # durable if it points at the mount, and an operator who moves it into
      # the container's own filesystem gets a database that dies with the
      # container without being told.
      AGENTPLEX_DATABASE_FILE: /var/lib/agentplex/agentplex.db
      AGENTPLEX_LOG_LEVEL: ${AGENTPLEX_LOG_LEVEL:-info}
    volumes:
      # Named, so `docker compose down` is not the same act as deleting the
      # database. `down -v` is.
      #
      # The hub's entire state — its identity, the servers paired to it, the
      # tokens they hold — is one file plus SQLite's -wal and -shm beside it,
      # which is small enough to lose without noticing.
      #
      # A named volume survives `down`, `up --build`, and the image
      # being rebuilt underneath it; an anonymous one is abandoned by a `down`
      # and replaced by an empty one on the next `up`, which loses the database
      # without deleting anything and without saying so.
      - hub-data:/var/lib/agentplex
    ports:
      # Loopback by default: with Caddy in front, nothing outside this machine
      # should reach the hub's plain HTTP port. AGENTPLEX_HUB_BIND is what you
      # change when something else, or nothing, terminates TLS.
      - '${AGENTPLEX_HUB_BIND:-127.0.0.1}:8080:8080'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - hub
    environment:
      AGENTPLEX_DOMAIN: ${AGENTPLEX_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and the ACME account key live here. Losing this
      # volume means asking a certificate authority for everything again,
      # which is how a deployment meets a rate limit.
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'

volumes:
  hub-data:
  caddy-data:
  caddy-config:
